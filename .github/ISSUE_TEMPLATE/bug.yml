name: Bug report
description: Report incorrect behavior with a reproducible example
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a sanitized plan if helpful. Never include credentials or private workflow data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Revision, OS, Node version and browser
    validations:
      required: true
