name: Desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64
            executable: release/mac-arm64/Hyperion.app/Contents/MacOS/Hyperion
          - os: macos-15-intel
            target: --mac --x64
            executable: release/mac/Hyperion.app/Contents/MacOS/Hyperion
          - os: windows-latest
            target: --win --x64
            executable: release/win-unpacked/Hyperion.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:desktop
      - run: npm run desktop:dist -- ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:desktop
        env:
          HYPERION_DESKTOP_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: Hyperion-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
