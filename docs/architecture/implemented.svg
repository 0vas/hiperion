<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc"><title id="title">Hyperion v0.1 — cooperación implementada</title><desc id="desc">Cinco componentes de aplicación ArchiMate 3.2: interfaz web, adaptadores, límite HTTP, persistencia y motor de workflow. Ocho flujos dirigidos de comandos y estado.</desc><defs><marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334b63"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#213b51}.title{font-size:28px;font-weight:700}.note{font-size:15px;fill:#486279}.type{font-size:13px;fill:#42657a}.name{font-size:21px;font-weight:700}.edge{fill:none;stroke:#334b63;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#flow)}</style><rect width="1440" height="790" fill="#f7fafc"/><text x="50" y="50" class="title">Hyperion v0.1 · Cooperación implementada</text><text x="50" y="83" class="note">ArchiMate 3.2 · Application Component + Flow · Responsabilidades lógicas del primer incremento</text><text x="50" y="118" class="note">El agente externo ejecuta el trabajo. Hyperion registra el estado y aplica las reglas del proceso.</text>
