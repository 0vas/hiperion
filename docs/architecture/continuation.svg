<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" role="img" aria-labelledby="title desc">
<title id="title">Hyperion · Reanudación independiente del harness</title>
<desc id="desc">Seis componentes de aplicación ArchiMate y ocho flujos. Un conector externo retoma la sesión; Hyperion conserva decisiones y entregas.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#465c72"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#1e354b}.title{font-size:26px;font-weight:700}.name{font-size:21px;font-weight:700}.note{font-size:14px}.type{font-size:12px;fill:#4b6375}.flow{fill:none;stroke:#465c72;stroke-width:1.5;stroke-dasharray:7 4;marker-end:url(#arrow)}</style>
<rect width="1180" height="660" fill="#f8fafc"/>
<text x="50" y="55" class="title">Hyperion · Reanudación independiente del harness</text>
<text x="50" y="88" class="note">ArchiMate 3.2 · Componentes de aplicación y relaciones Flow · Núcleo 0.5</text>
<text x="50" y="115" class="note">La respuesta y su solicitud de reanudación se guardan juntas. Confirmar entrega no completa el trabajo.</text>
<g id="C1" data-archimate-type="ApplicationComponent"><rect x="50" y="160" width="300" height="120" fill="#e8f3fa" stroke="#4b6375"/><text x="65" y="186" class="type">«Application Component»</text><text x="65" y="222" class="name">Canvas</text><text x="65" y="250" class="note">Respuesta humana · estado SSE</text><g fill="#e8f3fa" stroke="#4b6375"><rect x="318" y="172" width="20" height="27"/><rect x="311" y="176" width="12" height="7"/><rect x="311" y="188" width="12" height="7"/></g></g>
<g id="C2" data-archimate-type="ApplicationComponent"><rect x="440" y="160" width="300" height="120" fill="#e8f3fa" stroke="#4b6375"/><text x="455" y="186" class="type">«Application Component»</text><text x="455" y="222" class="name">API local</text><text x="455" y="250" class="note">Roles · revisión · validación</text><g fill="#e8f3fa" stroke="#4b6375"><rect x="708" y="172" width="20" height="27"/><rect x="701" y="176" width="12" height="7"/><rect x="701" y="188" width="12" height="7"/></g></g>
<g id="C3" data-archimate-type="ApplicationComponent"><rect x="830" y="160" width="300" height="120" fill="#e8f3fa" stroke="#4b6375"/><text x="845" y="186" class="type">«Application Component»</text><text x="845" y="222" class="name">Store + motor</text><text x="845" y="250" class="note">Snapshot y recibo atómicos</text><g fill="#e8f3fa" stroke="#4b6375"><rect x="1098" y="172" width="20" height="27"/><rect x="1091" y="176" width="12" height="7"/><rect x="1091" y="188" width="12" height="7"/></g></g>
<g id="C4" data-archimate-type="ApplicationComponent"><rect x="830" y="410" width="300" height="120" fill="#e8f3fa" stroke="#4b6375"/><text x="845" y="436" class="type">«Application Component»</text><text x="845" y="472" class="name">Cola de reanudación</text><text x="845" y="500" class="note">Binding · entrega · lease · SQLite</text><g fill="#e8f3fa" stroke="#4b6375"><rect x="1098" y="422" width="20" height="27"/><rect x="1091" y="426" width="12" height="7"/><rect x="1091" y="438" width="12" height="7"/></g></g>
<g id="C5" data-archimate-type="ApplicationComponent"><rect x="440" y="410" width="300" height="120" fill="#e8f3fa" stroke="#4b6375"/><text x="455" y="436" class="type">«Application Component»</text><text x="455" y="472" class="name">Worker genérico</text><text x="455" y="500" class="note">IO local · sin espera del modelo</text><g fill="#e8f3fa" stroke="#4b6375"><rect x="708" y="422" width="20" height="27"/><rect x="701" y="426" width="12" height="7"/><rect x="701" y="438" width="12" height="7"/></g></g>
<g id="C6" data-archimate-type="ApplicationComponent"><rect x="50" y="410" width="300" height="120" fill="#fff2d9" stroke="#4b6375"/><text x="65" y="436" class="type">«Application Component»</text><text x="65" y="472" class="name">Conector de harness</text><text x="65" y="500" class="note">Implementado por el integrador</text><g fill="#fff2d9" stroke="#4b6375"><rect x="318" y="422" width="20" height="27"/><rect x="311" y="426" width="12" height="7"/><rect x="311" y="438" width="12" height="7"/></g></g>
<g id="F1" data-archimate-type="Flow" data-source="C1" data-target="C2"><path d="M350 220 H440" class="flow"/><text x="395" y="207" text-anchor="middle" class="note">Decisión</text></g>
<g id="F2" data-archimate-type="Flow" data-source="C2" data-target="C3"><path d="M740 220 H830" class="flow"/><text x="785" y="207" text-anchor="middle" class="note">Comando</text></g>
<g id="F3" data-archimate-type="Flow" data-source="C3" data-target="C4"><path d="M980 280 V410" class="flow"/><text x="1070" y="347" text-anchor="middle" class="note">Encola en transacción</text></g>
<g id="F4" data-archimate-type="Flow" data-source="C4" data-target="C5"><path d="M830 470 H740" class="flow"/><text x="785" y="398" text-anchor="middle" class="note">Entrega con lease</text></g>
<g id="F5" data-archimate-type="Flow" data-source="C5" data-target="C6"><path d="M440 470 H350" class="flow"/><text x="395" y="398" text-anchor="middle" class="note">Retomar sesión</text></g>
<g id="F6" data-archimate-type="Flow" data-source="C6" data-target="C2"><path d="M200 410 V345 H590 V280" class="flow"/><text x="420" y="334" text-anchor="middle" class="note">Plan y resultados</text></g>
<g id="F7" data-archimate-type="Flow" data-source="C6" data-target="C5"><path d="M350 500 H440" class="flow"/><text x="395" y="543" text-anchor="middle" class="note">Acuse / reconciliación</text></g>
<g id="F8" data-archimate-type="Flow" data-source="C5" data-target="C4"><path d="M740 500 H830" class="flow"/><text x="785" y="543" text-anchor="middle" class="note">Confirmar entrega</text></g>
<path d="M50 590H1130" stroke="#cbd5e1"/>
<text x="50" y="620" class="note">Azul: componentes incluidos. Ámbar: conector externo pendiente por harness; no implica control de su chat nativo.</text>
</svg>
