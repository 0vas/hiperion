<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="830" viewBox="0 0 1450 830" role="img" aria-labelledby="title desc">
<title id="title">Hyperion — cooperación de aplicaciones</title>
<desc id="desc">Borrador ArchiMate 3.2. Seis componentes de aplicación conectados por flujos dirigidos. Una herramienta externa integra Hyperion; la ejecución puede permanecer en ella o delegarse al coordinador de Hyperion.</desc>
<defs><marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334b63"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#173149}.title{font-size:29px;font-weight:700}.sub{font-size:16px;fill:#4b6275}.type{font-size:13px;fill:#42657a}.name{font-size:21px;font-weight:700}.note{font-size:15px;fill:#3c566d}.label{font-size:14px;fill:#334b63}.edge{fill:none;stroke:#334b63;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#flow)}</style>
<rect width="1450" height="830" fill="#f7fafc"/>
<text x="50" y="52" class="title">Hyperion · Cooperación de aplicaciones</text>
<text x="50" y="84" class="sub">ArchiMate 3.2 · Vista lógica inicial · Borrador para discusión · 7 de octubre de 2026</text>
<text x="50" y="130" class="note">Dos modos alternativos de coordinación; una única autoridad por ejecución. Los componentes no implican servicios separados.</text>

